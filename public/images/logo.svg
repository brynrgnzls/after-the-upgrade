<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="100%" height="100%">
  <defs>
    <linearGradient id="chipGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182028"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (0, 0, 72, 72) scaled from 100x100 mark -->
  <g transform="translate(6, 6) scale(0.6)">
    <!-- Dark Shield Background -->
    <rect x="2" y="2" width="96" height="96" rx="20" fill="#0e1217" stroke="#252d38" stroke-width="2"/>
    
    <!-- Subtle Grid Pattern in background -->
    <line x1="2" y1="50" x2="98" y2="50" stroke="#1f2733" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="50" y1="2" x2="50" y2="98" stroke="#1f2733" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#18202a" stroke-width="1.5"/>

    <!-- Outer Regenerative Loop Arc 1 -->
    <path d="M 50,12 A 38,38 0 0,1 86,58 L 82,56" fill="none" stroke="#00ccff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 86,58 A 38,38 0 0,1 50,88" fill="none" stroke="#00ff66" stroke-width="4" stroke-linecap="round"/>
    <polygon points="46,84 52,88 46,92" fill="#00ff66"/>

    <!-- Outer Regenerative Loop Arc 2 -->
    <path d="M 50,88 A 38,38 0 0,1 14,44 L 18,46" fill="none" stroke="#00ff66" stroke-width="4" stroke-linecap="round"/>
    <path d="M 14,44 A 38,38 0 0,1 48,12" fill="none" stroke="#00ccff" stroke-width="4" stroke-linecap="round"/>
    <polygon points="54,16 48,12 54,8" fill="#00ccff"/>

    <!-- Circuit Trace Nodes -->
    <circle cx="77" cy="23" r="3.5" fill="#0e1217" stroke="#00ccff" stroke-width="2"/>
    <circle cx="77" cy="23" r="1.5" fill="#00ccff"/>
    <circle cx="23" cy="77" r="3.5" fill="#0e1217" stroke="#00ff66" stroke-width="2"/>
    <circle cx="23" cy="77" r="1.5" fill="#00ff66"/>

    <!-- Microchip Center -->
    <g transform="translate(50, 50)">
      <line x1="-16" y1="-22" x2="-16" y2="-17" stroke="#00ccff" stroke-width="2"/>
      <line x1="0" y1="-22" x2="0" y2="-17" stroke="#00ff66" stroke-width="2"/>
      <line x1="16" y1="-22" x2="16" y2="-17" stroke="#00ccff" stroke-width="2"/>
      <line x1="-16" y1="17" x2="-16" y2="22" stroke="#00ff66" stroke-width="2"/>
      <line x1="0" y1="17" x2="0" y2="22" stroke="#00ccff" stroke-width="2"/>
      <line x1="16" y1="17" x2="16" y2="22" stroke="#00ff66" stroke-width="2"/>
      <line x1="-22" y1="-10" x2="-17" y2="-10" stroke="#00ccff" stroke-width="2"/>
      <line x1="-22" y1="10" x2="-17" y2="10" stroke="#00ff66" stroke-width="2"/>
      <line x1="17" y1="-10" x2="22" y2="-10" stroke="#00ccff" stroke-width="2"/>
      <line x1="17" y1="10" x2="22" y2="10" stroke="#00ff66" stroke-width="2"/>

      <rect x="-18" y="-18" width="36" height="36" rx="5" fill="url(#chipGradH)" stroke="#3d4957" stroke-width="1.5"/>
      <circle cx="-12" cy="-12" r="2" fill="#00ccff"/>

      <path d="M -10,10 L -4,-8 L 2,10 M -8,4 L 0,4" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 0,-8 L 0,4 Q 0,10 6,10 Q 12,10 12,4 L 12,-8" fill="none" stroke="#00ccff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -5,-11 L 0,-15 L 5,-11" fill="none" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(80, 24)">
    <!-- Small Category/Telemetry Tracker -->
    <text x="0" y="2" fill="#00ccff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.5">INITIATIVE // HARDWARE STEWARDSHIP</text>
    
    <!-- Main Headline -->
    <text x="0" y="22" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="0.5">AFTER THE UPGRADE</text>
    
    <!-- Campaign Slogan -->
    <text x="0" y="38" fill="#00ff66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">REPAIR • REUSE • RETURN RESPONSIBLY</text>
  </g>
</svg>
