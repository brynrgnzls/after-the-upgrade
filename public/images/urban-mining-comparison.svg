<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00ccff" />
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#212638" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)" rx="12" />
  <rect width="900" height="500" fill="url(#gridPattern)" rx="12" opacity="0.6" />
  <rect width="900" height="500" fill="none" stroke="#2b3245" stroke-width="1.5" rx="12" />

  <!-- Header Section -->
  <text x="50" y="55" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">DATA INFOGRAPHIC // RESOURCE CONCENTRATION</text>
  <text x="50" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">Geological Mining vs. Urban Mining (Yield per 1 Metric Ton)</text>

  <!-- Column 1: Geological Gold Ore -->
  <g transform="translate(50, 120)">
    <rect width="380" height="320" fill="#181d28" stroke="#2c3347" stroke-width="1" rx="8" />
    
    <!-- Tag -->
    <rect x="20" y="20" width="160" height="26" fill="#242c3d" rx="4" />
    <text x="30" y="37" fill="#8b9bb4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">RAW GEOLOGICAL ORE</text>

    <!-- Graphic: Big Rock / Small Gold -->
    <circle cx="90" cy="120" r="45" fill="#293042" stroke="#3d4760" stroke-width="2" />
    <text x="90" y="115" fill="#8b9bb4" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">1 TON</text>
    <text x="90" y="132" fill="#58667e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">EARTH ROCK</text>

    <text x="175" y="125" fill="#58667e" font-family="sans-serif" font-size="20">→</text>

    <!-- Tiny Gold Nugget -->
    <circle cx="240" cy="120" r="14" fill="url(#goldGrad)" stroke="#ffd166" stroke-width="1" />
    <text x="270" y="116" fill="#ffb703" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">~5 Grams</text>
    <text x="270" y="133" fill="#8b9bb4" font-family="'JetBrains Mono', monospace" font-size="11">REFINED GOLD</text>

    <!-- Metrics Bar -->
    <g transform="translate(20, 195)">
      <text x="0" y="0" fill="#8b9bb4" font-family="'JetBrains Mono', monospace" font-size="11">RELATIVE GOLD YIELD: 1X BASELINE</text>
      <rect y="10" width="340" height="12" fill="#10141d" rx="3" />
      <rect y="10" width="15" height="12" fill="#ffb703" rx="3" />
    </g>

    <!-- Environmental Footprint -->
    <g transform="translate(20, 250)">
      <text x="0" y="0" fill="#ff6b6b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">UPSTREAM FOOTPRINT:</text>
      <text x="0" y="18" fill="#8b9bb4" font-family="sans-serif" font-size="12">Requires massive open-pit excavation, cyanide heap</text>
      <text x="0" y="34" fill="#8b9bb4" font-family="sans-serif" font-size="12">leaching, high acid mine runoff, and diesel emissions.</text>
    </g>
  </g>

  <!-- Column 2: Urban E-Waste Mining -->
  <g transform="translate(470, 120)">
    <rect width="380" height="320" fill="#181d28" stroke="#00ff66" stroke-width="1.5" rx="8" />

    <!-- Tag -->
    <rect x="20" y="20" width="200" height="26" fill="rgba(0,255,102,0.12)" stroke="#00ff66" stroke-width="1" rx="4" />
    <text x="30" y="37" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DISCARDED ELECTRONICS</text>

    <!-- Graphic: Smartphones / Huge Gold & Copper -->
    <rect x="45" y="75" width="80" height="90" fill="#12241e" stroke="#00ff66" stroke-width="2" rx="8" />
    <!-- Circuit lines on phone -->
    <path d="M 60 90 L 85 90 L 85 110 M 85 130 L 110 130" fill="none" stroke="#00ccff" stroke-width="1.5" />
    <text x="85" y="145" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">1 TON TECH</text>

    <text x="160" y="125" fill="#00ff66" font-family="sans-serif" font-size="20">→</text>

    <!-- Large Gold Bar Yield -->
    <rect x="200" y="100" width="40" height="40" fill="url(#goldGrad)" stroke="#ffd166" stroke-width="1" rx="4" />
    <text x="250" y="115" fill="#00ff66" font-family="-apple-system, sans-serif" font-size="20" font-weight="900">~300 Grams</text>
    <text x="250" y="132" fill="#8b9bb4" font-family="'JetBrains Mono', monospace" font-size="11">GOLD (60X CONCENTRATION)</text>
    <text x="250" y="147" fill="#00ccff" font-family="'JetBrains Mono', monospace" font-size="10">+ 1kg Silver &amp; 100kg Copper</text>

    <!-- Metrics Bar -->
    <g transform="translate(20, 195)">
      <text x="0" y="0" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">RELATIVE GOLD YIELD: 60X MORE DENSE</text>
      <rect y="10" width="340" height="12" fill="#10141d" rx="3" />
      <rect y="10" width="320" height="12" fill="url(#greenGrad)" rx="3" />
    </g>

    <!-- Circular Advantage -->
    <g transform="translate(20, 250)">
      <text x="0" y="0" fill="#00ccff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CIRCULAR ADVANTAGE:</text>
      <text x="0" y="18" fill="#d1d8e0" font-family="sans-serif" font-size="12">Recovers refined, high-purity precious metals in closed</text>
      <text x="0" y="34" fill="#d1d8e0" font-family="sans-serif" font-size="12">smelting loops without displacing natural ecosystems.</text>
    </g>
  </g>
</svg>
