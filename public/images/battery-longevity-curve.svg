<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4444" />
      <stop offset="25%" stop-color="#00ff66" />
      <stop offset="75%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>
    <linearGradient id="plateauBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 255, 102, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 255, 102, 0.0)" />
    </linearGradient>
    <pattern id="graphGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2332" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect width="900" height="450" fill="#0c0e15" rx="10" />
  <rect width="900" height="450" fill="url(#graphGrid)" rx="10" />
  <rect width="900" height="450" fill="none" stroke="#252b3d" stroke-width="1.5" rx="10" />

  <!-- Title Header -->
  <text x="50" y="45" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">LITHIUM-ION ELECTROCHEMICAL CURVE</text>
  <text x="50" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">The 20% – 80% Rule: Battery Cycle Life vs. Daily Charge Range</text>

  <!-- Chart Area -->
  <g transform="translate(80, 110)">
    <!-- Axes -->
    <line x1="0" y1="240" x2="740" y2="240" stroke="#485470" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="240" stroke="#485470" stroke-width="2" />

    <!-- Y Axis Labels -->
    <text x="-15" y="15" fill="#8c9bb0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">4–5 YRS (1,500+ CYCLES)</text>
    <text x="-15" y="90" fill="#8c9bb0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">3 YRS (1,000 CYCLES)</text>
    <text x="-15" y="165" fill="#8c9bb0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">2 YRS (500 CYCLES)</text>
    <text x="-15" y="235" fill="#8c9bb0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">&lt; 1 YR (300 CYCLES)</text>

    <!-- Zone Background: 20% to 80% Sweet Spot -->
    <rect x="148" y="10" width="444" height="230" fill="url(#plateauBg)" />
    <line x1="148" y1="10" x2="148" y2="240" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="592" y1="10" x2="592" y2="240" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Zone Label -->
    <rect x="250" y="20" width="240" height="28" fill="#142c22" stroke="#00ff66" stroke-width="1" rx="4" />
    <text x="370" y="38" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">OPTIMAL LONGEVITY PLATEAU</text>

    <!-- The Longevity Curve -->
    <path d="M 0 210 Q 74 150 148 45 L 592 45 Q 666 120 740 180" fill="none" stroke="url(#curveGrad)" stroke-width="4" />

    <!-- Curve Data Points -->
    <circle cx="0" cy="210" r="5" fill="#ff4444" />
    <circle cx="148" cy="45" r="5" fill="#00ff66" />
    <circle cx="592" cy="45" r="5" fill="#00ff66" />
    <circle cx="740" cy="180" r="5" fill="#ffb703" />

    <!-- X Axis Ticks & Labels -->
    <text x="0" y="260" fill="#ff4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">0%</text>
    <text x="148" y="260" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">20%</text>
    <text x="370" y="260" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">50% (Storage)</text>
    <text x="592" y="260" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">80%</text>
    <text x="740" y="260" fill="#ffb703" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">100%</text>

    <!-- Explanatory Footnotes -->
    <g transform="translate(0, 280)">
      <text x="0" y="0" fill="#ff6b6b" font-family="sans-serif" font-size="11">⚠️ Deep discharge copper shunt risk</text>
      <text x="240" y="0" fill="#00ff66" font-family="sans-serif" font-size="11">✓ Stable voltage range preserves lithium polymer chemistry</text>
      <text x="590" y="0" fill="#ffb703" font-family="sans-serif" font-size="11">⚠️ High-voltage oxidation &amp; heat stress</text>
    </g>
  </g>
</svg>
